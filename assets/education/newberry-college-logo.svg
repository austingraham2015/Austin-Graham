<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Newberry College logo</title>
  <desc id="desc">Newberry College wordmark with wolves text.</desc>
  <rect width="900" height="420" fill="#f3f3f3"/>
  <g transform="translate(90,40)">
    <rect x="0" y="0" width="720" height="250" rx="18" fill="#16395f"/>
    <text x="360" y="120" text-anchor="middle" font-size="120" font-weight="800" font-family="Arial, Helvetica, sans-serif" fill="#ffffff" letter-spacing="2">NEWBERRY</text>
    <text x="360" y="205" text-anchor="middle" font-size="84" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#e9d7b5" letter-spacing="8">WOLVES</text>
  </g>
</svg>
