<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Newberry College</title>
  <desc id="desc">Newberry College logo with large wordmark and wolves lettering.</desc>
  <rect width="900" height="400" fill="#f2f2f2"/>

  <g transform="translate(0,25)">
    <text x="450" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="170" font-weight="900" fill="#1a2d55" letter-spacing="2">NEWBERRY</text>
    <text x="450" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="200" font-weight="900" fill="#1a2d55" letter-spacing="-6">WOLVES</text>
  </g>
</svg>
